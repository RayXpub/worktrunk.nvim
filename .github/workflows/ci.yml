name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        uses: jdx/mise-action@v4
        with:
          install_args: stylua aqua:Kampfkarren/selene

      - name: Run linters
        run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Mise and Worktrunk
        uses: jdx/mise-action@v4
        with:
          install_args: lua worktrunk

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.10.4

      - name: Run tests with coverage
        run: mise run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: luacov-report
          path: luacov.report.out
