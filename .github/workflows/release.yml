name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: jdx/mise-action@v4
        with:
          install_args: node

      - name: Install dependencies
        run: npm ci

      - name: Create release pull request or GitHub release
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          title: Release
          commit: Release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clarify release pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:changeset-release/main`,
            });

            if (pulls.length === 0) return;

            const pull = pulls[0];
            const body = pull.body ?? "";
            const marker = "\n# Releases";
            const markerIndex = body.indexOf(marker);
            const releases = markerIndex === -1 ? "" : body.slice(markerIndex);
            const introduction = [
              "This PR is maintained by the Changesets release workflow.",
              "Merging it updates the plugin version and changelog, then creates a Git tag and GitHub Release.",
              "Nothing is published to npm. Additional changesets merged into `main` will update this PR.",
            ].join(" ");

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pull.number,
              body: introduction + releases,
            });
